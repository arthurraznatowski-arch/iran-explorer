<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jiroft Network with Gallery and Timeline</title>
<style>
  :root {
    --bg1:#f4efe5;
    --bg2:#e6dcc6;
    --paper:#fbf8f1;
    --paper-2:#f6efdf;
    --text:#2f271e;
    --muted:#726658;
    --border:#d7c8b0;
    --border-strong:#c6af8c;
    --gold:#9a7138;
    --gold-2:#bb8c4f;
    --teal:#3d6d70;
    --teal-2:#6b9698;
    --soft:#efe5d3;
    --shadow:0 10px 28px rgba(58,42,19,.10);
    --shadow-soft:0 4px 12px rgba(58,42,19,.07);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:linear-gradient(180deg,var(--bg1),var(--bg2));color:var(--text);font:16px/1.55 Georgia,"Times New Roman",serif}
  body.fa{font-family:Tahoma,"Segoe UI",Arial,sans-serif}
  .app{max-width:1380px;margin:0 auto;padding:22px 16px 36px}
  .shell{background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,.26));border:1px solid var(--border-strong);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
  .hero{padding:22px 22px 18px;border-bottom:1px solid var(--border);background:
      radial-gradient(circle at top right, rgba(187,140,79,.18), transparent 28%),
      radial-gradient(circle at bottom left, rgba(61,109,112,.12), transparent 28%),
      linear-gradient(180deg,#fcfaf5,#f3ebdc);
  }
  .hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
  .title-wrap h1{margin:0;font-size:34px;line-height:1.14}
  .subtitle{margin:8px 0 0;max-width:900px;color:var(--muted);font-size:15px;line-height:1.62}
  .langbar{display:flex;gap:8px;flex-wrap:wrap}
  .langbtn{border:1px solid var(--border-strong);background:var(--paper);color:var(--text);padding:8px 12px;border-radius:999px;font:600 13px/1.2 system-ui,Arial,sans-serif;cursor:pointer;box-shadow:var(--shadow-soft)}
  .langbtn.active{background:var(--gold);border-color:var(--gold);color:#fff}
  .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:rgba(255,255,255,.6);padding:6px 10px;border-radius:999px;color:var(--muted);font:600 12px/1.2 system-ui,Arial,sans-serif}
  .content{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(340px,.85fr);gap:16px;padding:16px;align-items:start}
  .panel{background:linear-gradient(180deg,var(--paper),var(--paper-2));border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow-soft)}
  .viz{padding:14px}
  .side{padding:18px;position:sticky;top:10px}
  svg{display:block;width:100%;height:auto;min-height:520px}
  .frame{fill:none;stroke:var(--border-strong);stroke-width:1.2}
  .frame2{fill:none;stroke:rgba(154,113,56,.18);stroke-width:1}
  .edge{fill:none;stroke:#a99d8c;stroke-width:2.6;opacity:.86;transition:stroke .2s ease, stroke-width .2s ease, opacity .2s ease}
  .edge.indirect{stroke-dasharray:8 6}
  .edge.active{stroke:var(--teal);stroke-width:4.5;opacity:1}
  .flow-dot{fill:var(--teal);opacity:.9}
  .flow-dot.alt{fill:var(--gold-2);opacity:.55}
  .region{cursor:pointer}
  .region circle{fill:#fffdf9;stroke:var(--border-strong);stroke-width:1.8;transition:fill .2s ease, stroke .2s ease, stroke-width .2s ease}
  .region:hover circle{stroke:var(--gold)}
  .region.active circle{fill:var(--soft);stroke:var(--gold);stroke-width:2.8}
  .region text{pointer-events:none}
  .label{font-size:15px;font-weight:700;fill:var(--text);text-anchor:middle}
  .sub{font-size:11px;fill:var(--muted);text-anchor:middle}
  .center circle{fill:#f8eed8;stroke:var(--gold);stroke-width:2.5}
  .center .label{font-size:18px;font-weight:800}
  .chip{fill:#fffdf8;stroke:var(--border);stroke-width:1}
  .edge-label{font-size:11px;fill:var(--muted);text-anchor:middle}
  .legend{display:flex;flex-wrap:wrap;gap:10px;margin:10px 6px 4px;color:var(--muted);font:12px/1.35 system-ui,Arial,sans-serif}
  .key{display:inline-flex;align-items:center;gap:6px}
  .sample{width:26px;height:0;border-top:2px solid var(--muted)}
  .sample.dashed{border-top-style:dashed}
  .dot-sample{width:11px;height:11px;border-radius:50%;background:var(--teal);display:inline-block}
  .viz-note{margin:12px 6px 2px;padding:10px 12px;border:1px solid var(--border);border-radius:14px;background:rgba(255,255,255,.55);color:var(--muted);font-size:12px;line-height:1.56}

  .eyebrow{font:700 11px/1.2 system-ui,Arial,sans-serif;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
  h2{margin:0;font-size:28px;line-height:1.2}
  .status{display:inline-flex;align-items:center;gap:8px;margin-top:10px;padding:5px 11px;border-radius:999px;background:#fffdfa;border:1px solid var(--border);color:var(--muted);font:600 11px/1.2 system-ui,Arial,sans-serif}
  .status-dot{width:8px;height:8px;border-radius:50%;background:var(--teal);display:inline-block}
  .section{margin-top:16px}
  .section-title{font:700 11px/1.2 system-ui,Arial,sans-serif;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px}
  .section p{margin:0;font-size:14px;line-height:1.72}
  .evidence{margin-top:8px;padding:12px 13px;background:linear-gradient(180deg,#fffdf9,#f7f0e4);border:1px solid var(--border);border-radius:15px;font-size:13px;line-height:1.72}

  .gallery{display:grid;grid-template-columns:1fr;gap:10px;margin-top:10px}
  .artifact-card{display:flex;align-items:flex-start;gap:10px;padding:10px 11px;border:1px solid var(--border);border-radius:14px;background:rgba(255,255,255,.65)}
  .artifact-icon{flex:0 0 auto;width:38px;height:38px;border-radius:12px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#fffdf9,#f2e9d9)}
  .artifact-icon svg{width:24px;height:24px;min-height:auto;display:block}
  .artifact-title{font-weight:700;font-size:13px;line-height:1.35}
  .artifact-desc{font-size:12px;line-height:1.55;color:var(--muted);margin-top:2px}

  .controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  .controls button{font:600 13px/1.2 system-ui,Arial,sans-serif;border:1px solid var(--border-strong);background:var(--paper);color:var(--text);padding:9px 12px;border-radius:12px;cursor:pointer;box-shadow:var(--shadow-soft)}
  .controls button.primary{background:var(--gold);border-color:var(--gold);color:#fff}
  .source{margin-top:14px;padding-top:12px;border-top:1px solid var(--border);font-size:12px;line-height:1.65;color:var(--muted)}

  .timeline-wrap{padding:0 16px 16px}
  .timeline-panel{padding:16px 16px 18px}
  .timeline-header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .timeline{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;position:relative}
  .timeline:before{content:"";position:absolute;left:0;right:0;top:18px;height:2px;background:linear-gradient(90deg,var(--border-strong),var(--border));z-index:0}
  .step{position:relative;z-index:1;padding-top:0}
  .marker{width:36px;height:36px;border-radius:50%;background:#fffdfa;border:2px solid var(--border-strong);display:flex;align-items:center;justify-content:center;font:700 13px/1 system-ui,Arial,sans-serif;color:var(--muted);margin:0 auto 10px;transition:.2s ease}
  .step.active .marker{background:var(--soft);border-color:var(--gold);color:var(--gold)}
  .step-card{padding:10px 10px 12px;border:1px solid var(--border);border-radius:14px;background:rgba(255,255,255,.6);min-height:120px}
  .step.active .step-card{background:linear-gradient(180deg,#fffaf2,#f6ecdc);border-color:var(--border-strong)}
  .step-title{font-weight:700;font-size:13px;line-height:1.4;margin-bottom:4px}
  .step-desc{font-size:12px;line-height:1.55;color:var(--muted)}

  .footer-text{margin-top:14px;padding:12px 14px;border-radius:16px;border:1px solid var(--border);background:rgba(255,255,255,.52);font-size:12px;color:var(--muted);line-height:1.6}

  body.fa .title-wrap h1, body.fa h2, body.fa .subtitle, body.fa .section p, body.fa .evidence, body.fa .step-desc{line-height:1.9}
  body.fa .eyebrow, body.fa .section-title{letter-spacing:0}
  @media (max-width: 980px) {
    .content{grid-template-columns:1fr}
    .side{position:static}
    .timeline{grid-template-columns:1fr}
    .timeline:before{display:none}
    .marker{margin-inline-start:0}
    .step{display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:start}
    .step-card{min-height:auto}
  }
</style>
</head>
<body>
<div class="app">
  <div class="shell">
    <section class="hero">
      <div class="hero-top">
        <div class="title-wrap">
          <h1 id="mainTitle"></h1>
          <p class="subtitle" id="mainSubtitle"></p>
        </div>
        <div class="langbar" aria-label="Language selector">
          <button class="langbtn active" data-lang="en">English</button>
          <button class="langbtn" data-lang="ru">Русский</button>
          <button class="langbtn" data-lang="fa">فارسی</button>
          <button class="langbtn" data-lang="de">Deutsch</button>
        </div>
      </div>
      <div class="meta">
        <span class="pill" id="pill1"></span>
        <span class="pill" id="pill2"></span>
        <span class="pill" id="pill3"></span>
      </div>
    </section>

    <div class="content">
      <section class="panel viz">
        <svg id="network" viewBox="0 0 780 540" role="img" aria-labelledby="svgTitle svgDesc">
          <title id="svgTitle"></title>
          <desc id="svgDesc"></desc>

          <rect class="frame" x="8" y="8" width="764" height="524" rx="18" ry="18"></rect>
          <rect class="frame2" x="18" y="18" width="744" height="504" rx="12" ry="12"></rect>

          <path id="edge-shahdad" class="edge" d="M392 270 C332 238 255 163 176 108"></path>
          <path id="edge-susa" class="edge indirect" d="M392 270 C267 295 172 317 82 346"></path>

          <path id="edge-indus" class="edge indirect" d="M392 270 C503 252 596 254 698 270"></path>
          <path id="edge-gulf" class="edge indirect" d="M392 270 C432 368 497 433 570 473"></path>

          <g id="dots"></g>

          <g>

            <rect class="chip" x="482" y="141" width="156" height="28" rx="12" ry="12"></rect>
            <text id="edge-text-shahr" class="edge-label" x="560" y="159"></text>
            <rect class="chip" x="537" y="231" width="166" height="28" rx="12" ry="12"></rect>

            <text id="edge-text-gulf" class="edge-label" x="553" y="422"></text>
          </g>

          <g class="region" data-id="shahdad" tabindex="0" role="button">
            <circle cx="168" cy="102" r="58"></circle>
            <text id="node-shahdad" class="label" x="168" y="99"></text>
            <text id="node-shahdad-sub" class="sub" x="168" y="119"></text>
          </g>

          <g class="region" data-id="susa" tabindex="0" role="button">
            <circle cx="82" cy="350" r="54"></circle>
            <text id="node-susa" class="label" x="82" y="347"></text>
            <text id="node-susa-sub" class="sub" x="82" y="367"></text>
          </g>

          <g class="region" data-id="shahr" tabindex="0" role="button">
            <circle cx="648" cy="86" r="64"></circle>
            <text id="node-shahr" class="label" x="648" y="83"></text>
            <text id="node-shahr-sub" class="sub" x="648" y="103"></text>
          </g>

          <g class="region" data-id="indus" tabindex="0" role="button">
            <circle cx="706" cy="272" r="58"></circle>
            <text id="node-indus" class="label" x="706" y="269"></text>
            <text id="node-indus-sub" class="sub" x="706" y="289"></text>
          </g>

          <g class="region" data-id="gulf" tabindex="0" role="button">
            <circle cx="578" cy="480" r="62"></circle>
            <text id="node-gulf" class="label" x="578" y="477"></text>
            <text id="node-gulf-sub" class="sub" x="578" y="497"></text>
          </g>

          <g class="center">
            <circle cx="392" cy="270" r="80"></circle>
            <text id="node-center" class="label" x="392" y="262"></text>
            <text id="node-center-sub1" class="sub" x="392" y="282"></text>
            <text id="node-center-sub2" class="sub" x="392" y="299"></text>
          </g>
        </svg>

        <div class="legend">
          <span class="key"><span class="sample"></span><span id="legend1"></span></span>
          <span class="key"><span class="sample dashed"></span><span id="legend2"></span></span>
          <span class="key"><span class="dot-sample"></span><span id="legend3"></span></span>
        </div>
        <div class="viz-note" id="vizNote"></div>
      </section>

      <aside class="panel side">
        <div class="eyebrow" id="eyebrow"></div>
        <h2 id="name"></h2>
        <div class="status"><span class="status-dot"></span><span id="statusText"></span></div>

        <div class="section">
          <div class="section-title" id="whatTitle"></div>
          <p id="summary"></p>
        </div>

        <div class="section">
          <div class="section-title" id="evidenceTitle"></div>
          <div class="evidence" id="evidence"></div>
        </div>

        <div class="section">
          <div class="section-title" id="galleryTitle"></div>
          <div class="gallery" id="gallery"></div>
        </div>

        <div class="section">
          <div class="section-title" id="cautionTitle"></div>
          <p id="caution"></p>
        </div>

        <div class="controls">
          <button class="primary" id="toggleAuto"></button>
          <button id="resetBtn"></button>
        </div>

        <div class="source" id="source"></div>
      </aside>
    </div>

    <div class="timeline-wrap">
      <section class="panel timeline-panel">
        <div class="timeline-header">
          <div class="section-title" id="timelineTitle"></div>
        </div>
        <div class="timeline" id="timeline"></div>
        <div class="footer-text" id="footerText"></div>
      </section>
    </div>
  </div>
</div>

    center1: document.getElementById("node-center-sub1"),
    center2: document.getElementById("node-center-sub2")
  }
};

function renderGallery(regionData) {
  el.gallery.innerHTML = "";
  const titleMap = DATA[lang].goodsTitleMap;
  (regionData.goods || []).forEach(([kind, desc]) => {
    const card = document.createElement("div");
    card.className = "artifact-card";
    card.innerHTML = `
      <div class="artifact-icon">${iconSVG[kind] || iconSVG.prestige}</div>
      <div>
        <div class="artifact-title">${titleMap[kind] || kind}</div>
        <div class="artifact-desc">${desc}</div>
      </div>
    `;
    el.gallery.appendChild(card);
  });
}

function renderTimeline(activeIndex) {
  const t = DATA[lang].timeline;
  el.timeline.innerHTML = "";
  t.forEach((item, i) => {
    const step = document.createElement("div");
    step.className = "step" + (i === activeIndex ? " active" : "");
    step.innerHTML = `
      <div class="marker">${i+1}</div>
      <div class="step-card">
        <div class="step-title">${item.label}</div>
        <div class="step-desc">${item.desc}</div>
      </div>
    `;
    el.timeline.appendChild(step);
  });
}

function setDetail(id) {
  current = id;
  const d = DATA[lang].regions[id];
  el.name.textContent = d.name;
  el.statusText.textContent = d.status;
  el.summary.textContent = d.summary;
  el.evidence.textContent = d.evidence;
  renderGallery(d);
  el.caution.textContent = d.caution;
  el.source.textContent = d.source;
  renderTimeline(d.timelineIndex ?? 0);

  document.querySelectorAll(".region").forEach(n => n.classList.toggle("active", n.dataset.id === id));
  document.querySelectorAll(".edge").forEach(e => e.classList.toggle("active", e.id === "edge-" + id));
}

function pin(id) {
  pinned = id;
  setDetail(id);
  autoPlay = false;
  el.toggleAuto.textContent = DATA[lang].ui.toggleOff;
}

function applyLanguage(newLang) {
  lang = newLang;
  const t = DATA[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = t.dir;
  document.body.className = t.bodyClass || "";

  el.mainTitle.textContent = t.ui.mainTitle;
  el.mainSubtitle.textContent = t.ui.mainSubtitle;
  el.pill1.textContent = t.ui.pill1;
  el.pill2.textContent = t.ui.pill2;
  el.pill3.textContent = t.ui.pill3;
  el.svgTitle.textContent = t.ui.titleSVG;
  el.svgDesc.textContent = t.ui.descSVG;
  el.legend1.textContent = t.ui.legend1;
  el.legend2.textContent = t.ui.legend2;
  el.legend3.textContent = t.ui.legend3;
  el.vizNote.textContent = t.ui.vizNote;
  el.eyebrow.textContent = t.ui.eyebrow;
  el.whatTitle.textContent = t.ui.whatTitle;
  el.evidenceTitle.textContent = t.ui.evidenceTitle;
  el.galleryTitle.textContent = t.ui.galleryTitle;
  el.cautionTitle.textContent = t.ui.cautionTitle;
  el.timelineTitle.textContent = t.ui.timelineTitle;
  el.toggleAuto.textContent = autoPlay ? t.ui.toggleOn : t.ui.toggleOff;
  el.resetBtn.textContent = t.ui.resetBtn;
  el.footerText.textContent = t.ui.footerText;

  labelEls.edge.shahdad.textContent = t.edgeLabels.shahdad;
  labelEls.edge.susa.textContent = t.edgeLabels.susa;
  labelEls.edge.shahr.textContent = t.edgeLabels.shahr;
  labelEls.edge.indus.textContent = t.edgeLabels.indus;
  labelEls.edge.gulf.textContent = t.edgeLabels.gulf;

  labelEls.node.shahdad.textContent = t.nodes.shahdad[0];
  labelEls.node.shahdadSub.textContent = t.nodes.shahdad[1];
  labelEls.node.susa.textContent = t.nodes.susa[0];
  labelEls.node.susaSub.textContent = t.nodes.susa[1];
  labelEls.node.shahr.textContent = t.nodes.shahr[0];
  labelEls.node.shahrSub.textContent = t.nodes.shahr[1];
  labelEls.node.indus.textContent = t.nodes.indus[0];
  labelEls.node.indusSub.textContent = t.nodes.indus[1];
  labelEls.node.gulf.textContent = t.nodes.gulf[0];
  labelEls.node.gulfSub.textContent = t.nodes.gulf[1];
  labelEls.node.center.textContent = t.nodes.center[0];
  labelEls.node.center1.textContent = t.nodes.center[1];
  labelEls.node.center2.textContent = t.nodes.center[2];

  document.querySelectorAll(".langbtn").forEach(btn => btn.classList.toggle("active", btn.dataset.lang === lang));
  setDetail(pinned);
}

document.querySelectorAll(".langbtn").forEach(btn => btn.addEventListener("click", () => applyLanguage(btn.dataset.lang)));

document.querySelectorAll(".region").forEach(node => {
  const id = node.dataset.id;
  node.addEventListener("mouseenter", () => setDetail(id));
  node.addEventListener("mouseleave", () => setDetail(pinned));
  node.addEventListener("focus", () => setDetail(id));
  node.addEventListener("blur", () => setDetail(pinned));
  node.addEventListener("click", () => pin(id));
  node.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      pin(id);
    }
  });
});

el.toggleAuto.addEventListener("click", () => {
  autoPlay = !autoPlay;
  el.toggleAuto.textContent = autoPlay ? DATA[lang].ui.toggleOn : DATA[lang].ui.toggleOff;
  if (autoPlay) {
    pinned = order[idx];
    setDetail(pinned);
  }
});

el.resetBtn.addEventListener("click", () => {
  pinned = "shahdad";
  idx = 0;
  setDetail(pinned);
});

const dotsLayer = document.getElementById("dots");
const movers = [];
order.forEach((id, i) => {
  const path = document.getElementById("edge-" + id);
  const length = path.getTotalLength();
  [0, 0.48].forEach((offset, j) => {
    const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    c.setAttribute("r", j === 0 ? "5" : "3.2");
    c.setAttribute("class", "flow-dot" + (j === 1 ? " alt" : ""));
    dotsLayer.appendChild(c);
    movers.push({id, path, length, el:c, speed:0.046 + i*0.004 + j*0.003, t:offset + i*0.06});
  });
});

function animate(ts) {
  const dt = Math.min(0.05, (ts - lastTime) / 1000);
  lastTime = ts;
  movers.forEach(m => {
    m.t += dt * m.speed;
    while (m.t > 1) m.t -= 1;
    const pt = m.path.getPointAtLength(m.length * m.t);
    m.el.setAttribute("cx", pt.x);
    m.el.setAttribute("cy", pt.y);
    const active = current === m.id || pinned === m.id;
    m.el.style.opacity = active ? 0.95 : 0.5;
    m.el.setAttribute("r", active ? (m.el.classList.contains("alt") ? "4.1" : "5.7") : (m.el.classList.contains("alt") ? "3.0" : "4.3"));
  });
  requestAnimationFrame(animate);
}

setInterval(() => {
  if (!autoPlay) return;
  idx = (idx + 1) % order.length;
  pinned = order[idx];
  setDetail(pinned);
}, 4300);

applyLanguage("en");
requestAnimationFrame(animate);
</script>
</body>
</html>
